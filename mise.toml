[tools]
# Primary runtime / package manager
bun = "1.4.0"

[tasks.install]
description = "Install dependencies"
run = "bun install"

[tasks.build]
description = "Build all packages"
run = "bun run build"

[tasks.test]
description = "Run all tests"
run = "bun run test"

[tasks.lint]
description = "Lint the codebase"
run = "bun run lint"

[tasks."lint:fix"]
description = "Lint and auto-fix"
run = "bun run lint:fix"

[tasks.type-check]
description = "Type-check all packages"
run = "bun run type-check"

[tasks.ci]
description = "Full verification (lint + type-check + test + build)"
depends = [
  "lint",
  "type-check",
  "test",
  "build"
]
