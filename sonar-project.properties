# SonarQube Cloud project config
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/
# projectKey and organization must match the values SonarCloud shows for this project.

sonar.projectKey=pleaseai_please
sonar.organization=pleaseai

# Sources and tests. This is a workspace, so the paths are per package - add the
# next package here when one is created.
sonar.sources=packages/core/src
sonar.tests=packages/core/src
sonar.test.inclusions=**/*.test.*,**/*.spec.*

# Coverage report emitted by the test runner - the same file Codecov uploads
sonar.javascript.lcov.reportPaths=packages/core/coverage/lcov.info

# Exclude generated, vendored, and coverage output from analysis. sonar.sources and
# sonar.tests point at the same directory, so the test patterns must be excluded from
# the main set too - otherwise the scanner fails with "File can't be indexed twice".
sonar.exclusions=**/dist/**,**/node_modules/**,**/coverage/**,**/*.test.*,**/*.spec.*
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/*.config.*
